<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sairahus 2026</title>
<!-- Warm up DNS + TLS to the backend while the LIFF SDK is still initialising.
     Saves a visible chunk of the first request on mobile data. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{ --blue:#2A7DE1; --deep:#1B5FB0; --red:#E60012; --yellow:#FFCC00;
         --ink:#16233A; --mute:#6B7A90; --line:#DDE5F0; --bg:#F3F7FD; }
  *{ box-sizing:border-box }
  body{ margin:0; background:var(--bg); color:var(--ink); font-size:16px;
        font-family:-apple-system,"Helvetica Neue","Noto Sans Thai",sans-serif; }
  #app{ max-width:520px; margin:0 auto; padding:16px 16px 40px }
  h1{ font-size:20px; margin:0 0 4px }
  .sub{ color:var(--mute); font-size:14px; margin:0 0 16px }
  .card{ background:#fff; border:1px solid var(--line); border-radius:14px;
         padding:16px; margin-bottom:12px }
  label{ display:block; font-weight:600; font-size:14px; margin:14px 0 6px }
  label:first-child{ margin-top:0 }
  .hintof{ font-weight:400; color:var(--mute); font-size:13px; display:block; margin-top:2px }
  input,select,textarea{ width:100%; padding:11px 12px; font:inherit; color:inherit;
         border:1px solid var(--line); border-radius:10px; background:#fff; }
  input:focus,select,textarea:focus{ outline:2px solid var(--blue); outline-offset:-1px }
  textarea{ min-height:76px; resize:vertical }
  button{ width:100%; padding:14px; font:inherit; font-weight:700; color:#fff;
          background:var(--blue); border:0; border-radius:999px; margin-top:18px; cursor:pointer }
  button:disabled{ background:var(--mute); cursor:default }
  button.ghost{ background:#fff; color:var(--blue); border:2px solid var(--blue); margin-top:8px }
  button.warn{ background:var(--red) }
  button.row{ width:auto; flex:1; margin:0; padding:11px }
  .flex{ display:flex; gap:8px; margin-top:12px }
  .coins{ display:flex; align-items:center; gap:10px; background:var(--blue); color:#fff;
          border-radius:14px; padding:16px; margin-bottom:12px }
  .coins b{ font-size:32px; line-height:1 }
  .lv{ display:flex; justify-content:space-between; align-items:center; gap:12px }
  .lv h3{ margin:0 0 2px; font-size:15px }
  .lv small{ color:var(--mute) }
  .txt{ margin-top:12px; padding:12px; background:var(--bg); border-radius:10px;
        border-left:4px solid var(--yellow); white-space:pre-wrap }
  .pill{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px;
         font-weight:700; background:var(--bg); color:var(--mute) }
  .pill.on{ background:var(--yellow); color:var(--ink) }
  .code{ font-size:34px; letter-spacing:14px; text-align:center; font-weight:700 }
  .msg{ padding:12px; border-radius:10px; margin-bottom:12px; font-size:14px }
  .msg.err{ background:#FDE8E9; color:#A3000C }
  .msg.ok{ background:#E4F3E7; color:#1B6B2C }
  .sub-img{ width:100%; border-radius:10px; display:block; background:var(--bg) }
  dl{ display:grid; grid-template-columns:1fr auto; gap:8px 12px; margin:0 }
  dt{ color:var(--mute); font-size:14px }
  dd{ margin:0; font-weight:700; text-align:right }
  ul{ margin:8px 0 0; padding-left:20px; color:var(--mute); font-size:14px }
</style>
</head>
<body>
<div id="app"><p class="sub">Loading…</p></div>

<script>
// Fill these in after deploying. LIFF_ID from the LINE Login channel, API from
// the Apps Script web app deployment (Anyone can access).
const LIFF_ID = '2010985053-LkeXPFID';
const API = 'https://script.google.com/macros/s/AKfycbyUbWfX5heEeSobJV49ENFCEQ28hcXBpkCvEEqFw3cFGl7kgM1NavxcZ1p-3plSeEvi/exec';

const YEARS = 4;    // years 1-4
const BAANS = 10;   // Baan 1-10

// Gadget names only — hints are free-style, seniors write whatever they like.
const GADGETS = ['Bamboo Copter', 'Anywhere Door', 'Search Light', 'Out of the Drawer'];
const HINT_PLACEHOLDER = 'Write anything about yourself…';

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const page = new URLSearchParams(location.search).get('p') || 'wallet';

let me = {};

async function api(action, data) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },   // text/plain avoids a CORS preflight
    body: JSON.stringify(Object.assign({ action, idToken: liff.getIDToken() }, data || {})),
  });
  return res.json();
}

function render(html) { app.innerHTML = html; }
function note(kind, text) {
  return text ? '<div class="msg ' + kind + '">' + esc(text) + '</div>' : '';
}
function flash(kind, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + kind;
  el.textContent = text;
  app.prepend(el);
  window.scrollTo(0, 0);
}

// ---------- screens ---------------------------------------------------------

function screenRegister() {
  const isEdit = me.registered;
  const opts = (n, from) => Array.from({ length: n }, (_, i) =>
    '<option value="' + (i + from) + '">' + (i + from) + '</option>').join('');

  render(
    '<h1>Join Sairahus 2026</h1>' +
    '<p class="sub">' + (isEdit ? 'Update your details' : 'Fill this in once — it lasts the whole event') + '</p>' +
    '<form id="f" class="card">' +
      '<label>I am a<select name="role" id="role" required>' +
        '<option value="">— select —</option>' +
        '<option value="junior">Junior (น้อง)</option><option value="senior">Senior (พี่)</option>' +
      '</select></label>' +
      '<label>Nickname<input name="nickname" required maxlength="30"></label>' +
      '<label>Full name<input name="realName" required maxlength="80"></label>' +
      '<label>Student ID<input name="studentId" required inputmode="numeric" pattern="\\d{7,12}"></label>' +
      '<label>University email (@student.mahidol)' +
        '<span class="hintof">Backup contact for this event only.</span>' +
        '<input type="email" name="email" required></label>' +
      '<label>Year<select name="year" required>' + opts(YEARS, 1) + '</select></label>' +
      '<label>Baan<select name="house" required>' + opts(BAANS, 1) + '</select></label>' +
      '<div id="seniorOnly" hidden>' +
        '<label>How many juniors can you take?<select name="capacity">' + opts(5, 1) + '</select></label>' +
        // Prefill on edit — register() overwrites all four columns, so empty
        // boxes here would silently wipe hints the senior already wrote.
        hintFields(isEdit ? me.hints : null) +
      '</div>' +
      '<button type="submit">' + (isEdit ? 'Save changes' : 'Register') + '</button>' +
    '</form>'
  );

  const toggle = () => $('#seniorOnly').hidden = $('#role').value !== 'senior';
  $('#role').addEventListener('change', toggle);
  if (isEdit) { $('#role').value = me.role; toggle(); }
  $('#f').addEventListener('submit', submitRegister);
}

/** Four free-style boxes. Only the ordering is guided, never the subject. */
function hintFields(values) {
  return '<p class="hintof" style="margin:0 0 4px">Write anything you like. ' +
      'Order them <b>vague → obvious</b>: hint 1 is cheapest for your junior, ' +
      'hint 4 gives you away.</p>' +
    GADGETS.map((g, i) =>
      '<label>Hint ' + (i + 1) + ' · ' + g +
        (i === 0 ? '<span class="hintof">Required — the one every junior can afford.</span>'
                 : '<span class="hintof">Optional</span>') +
        '<textarea name="hint' + (i + 1) + '" minlength="15" maxlength="200"' +
          ' placeholder="' + HINT_PLACEHOLDER + '"' +
          (i === 0 ? ' required' : '') + '>' + esc(values ? values[i] : '') + '</textarea>' +
      '</label>').join('');
}

async function submitRegister(ev) {
  ev.preventDefault();
  const btn = ev.target.querySelector('button');
  btn.disabled = true;
  const data = Object.fromEntries(new FormData(ev.target));
  const res = await api('register', data);
  btn.disabled = false;
  if (res.error) return flash('err', res.message || 'Could not register');
  render('<div class="card"><h1>You are in 🔵</h1>' +
    '<p class="sub">Close this page and use the menu in the chat.</p></div>');
  setTimeout(() => liff.closeWindow(), 1500);
}

/** Seniors rewriting their hints — mostly hint 3 on the morning of the event. */
function screenHint() {
  if (me.role !== 'senior') return render(note('err', 'This page is for seniors only.'));
  render(
    '<h1>My hints</h1>' +
    '<p class="sub">Your junior spends coins to unlock these one at a time. ' +
      'Make them hard to guess but possible.</p>' +
    '<form id="f" class="card">' + hintFields(me.hints) +
      '<button type="submit">Save</button></form>'
  );
  $('#f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('button');
    btn.disabled = true;
    const res = await api('saveHints', Object.fromEntries(new FormData(ev.target)));
    btn.disabled = false;
    flash(res.error ? 'err' : 'ok', res.error ? (res.message || 'Could not save') : 'Saved');
  });
}

function screenQuest() {
  if (!me.round) return render(note('err', 'Quest submissions are not open yet.'));
  render(
    '<h1>Submit a quest · Round ' + me.round + '</h1>' +
    '<p class="sub">Pick a quest here, then go back to the chat and send the photo.</p>' +
    me.quests.map(q =>
      '<div class="card lv"><div><h3>' + esc(q) + '</h3>' +
        '<small>' + (me.submitted.indexOf(q) >= 0 ? 'Submitted' : 'Not submitted') + '</small></div>' +
        (me.submitted.indexOf(q) >= 0 ? '<span class="pill on">✓</span>' :
          '<button class="row" data-q="' + esc(q) + '">Pick</button>') +
      '</div>').join('')
  );
  app.querySelectorAll('button[data-q]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true;
    const res = await api('pickQuest', { round: me.round, questId: b.dataset.q });
    if (res.error) { b.disabled = false; return flash('err', res.message || 'Could not pick that quest'); }
    render('<div class="card"><h1>Quest picked</h1>' +
      '<p class="sub">Go back to the chat and send your <b>photo</b> for this quest.</p></div>');
    setTimeout(() => liff.closeWindow(), 1800);
  }));
}

function screenWallet() {
  if (me.role === 'senior') {
    return render('<h1>Magic Pocket</h1>' +
      '<div class="card"><dl><dt>My juniors</dt><dd>' + me.juniorCount + '</dd>' +
      '<dt>Capacity</dt><dd>' + me.capacity + '</dd></dl></div>');
  }

  render(
    '<h1>Magic Pocket</h1>' +
    '<div class="coins"><b>' + me.balance + '</b>' +
      '<div>Dorayaki coins<br><small>Pass quests to earn more</small></div></div>' +
    (me.pairStatus === 'overflow'
      ? note('err', 'You have no senior assigned yet — please talk to a staff member.') : '') +
    me.hints.map(h => {
      let action;
      if (h.unlocked) action = '<span class="pill on">Unlocked</span>';
      else if (!h.available) action = '<span class="pill">Locked</span>';
      else if (!h.written) action = '<span class="pill">Not written yet</span>';
      else action = '<button class="row" data-lv="' + h.level + '">' +
        (h.cost ? h.cost + (h.cost > 1 ? ' coins' : ' coin') : 'Free') + '</button>';

      return '<div class="card">' +
        '<div class="lv"><div><h3>Hint ' + h.level + ' · ' + GADGETS[h.level - 1] + '</h3>' +
          '<small>' + (h.cost ? 'Costs ' + h.cost + (h.cost > 1 ? ' coins' : ' coin')
                              : 'Free at the reveal') + '</small></div>' + action + '</div>' +
        (h.unlocked ? '<div class="txt">' + esc(h.text) + '</div>' : '') +
      '</div>';
    }).join('')
  );

  app.querySelectorAll('button[data-lv]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true;
    const res = await api('unlockHint', { level: b.dataset.lv });
    if (res.error) { b.disabled = false; return flash('err', res.message || 'Could not unlock'); }
    me = await api('me');
    screenWallet();
  }));
}

function screenCheckin() {
  if (me.checkedIn) {
    return render('<h1>Checked in ✓</h1>' +
      '<div class="card"><p class="sub">Head to Village ' + esc(me.village || '-') +
      ' · Baan ' + esc(me.house) + '.</p></div>');
  }
  render(
    '<h1>Check in</h1>' +
    '<p class="sub">Enter the 4-digit Anywhere Door code from the sign at the entrance.</p>' +
    '<form id="f" class="card">' +
      '<input class="code" name="code" inputmode="numeric" pattern="\\d{4}" maxlength="4" required autofocus>' +
      '<button type="submit">Check in</button></form>'
  );
  $('#f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('button');
    btn.disabled = true;
    const res = await api('checkin', { code: ev.target.code.value });
    btn.disabled = false;
    if (res.error) return flash('err', res.message || 'Could not check in');
    me = await api('me');
    screenCheckin();
  });
}

async function screenStaff() {
  const s = await api('stats');
  if (s.error) return render(note('err', 'This page is for staff only.'));

  const phases = ['REGISTER','QUEST_R1','QUEST_R2','QUEST_R3','CHECKIN','HUNT','REVEAL'];
  render(
    '<h1>Staff</h1><p class="sub">Current phase: <b>' + esc(s.phase) + '</b></p>' +
    '<div class="card"><dl>' +
      '<dt>Juniors checked in</dt><dd>' + s.checkedInJuniors + ' / ' + s.juniors + '</dd>' +
      '<dt>Seniors checked in</dt><dd>' + s.checkedInSeniors + ' / ' + s.seniors + '</dd>' +
      '<dt>Unpaired juniors</dt><dd>' + s.unpaired + '</dd>' +
      '<dt>Quests awaiting review</dt><dd>' + s.pendingReviews + '</dd>' +
      '<dt>Check-in code</dt><dd>' + esc(s.checkinCode) + '</dd>' +
    '</dl>' +
    (s.noHints.length ? '<p class="sub" style="margin:14px 0 0">Seniors with no hints written (' +
      s.noHints.length + ')</p><ul>' + s.noHints.slice(0, 20).map(n => '<li>' + esc(n) + '</li>').join('') +
      '</ul>' : '') +
    '</div>' +
    (s.isLead ?
      '<div class="card"><label>Change phase<select id="ph">' +
        phases.map(p => '<option' + (p === s.phase ? ' selected' : '') + '>' + p + '</option>').join('') +
      '</select></label><button id="setph">Change phase</button>' +
      '<button id="cut" class="warn">Cut-off &amp; rematch</button></div>' : '') +
    '<button id="rev" class="ghost">Review quests (' + s.pendingReviews + ')</button>'
  );

  if (s.isLead) {
    $('#setph').addEventListener('click', async () => {
      const res = await api('setPhase', { phase: $('#ph').value });
      flash(res.error ? 'err' : 'ok', res.error ? 'Could not change phase' : 'Phase is now ' + res.phase);
    });
    $('#cut').addEventListener('click', async () => {
      if (!confirm('Reassign every junior whose senior did not check in? Run this once, at 13:30.')) return;
      $('#cut').disabled = true;
      const res = await api('cutoff');
      flash('ok', 'Moved ' + res.moved + ' juniors · ' + res.stranded + ' still need a human');
    });
  }
  $('#rev').addEventListener('click', screenReview);
}

async function screenReview() {
  const res = await api('pending');
  if (res.error) return render(note('err', 'This page is for staff only.'));
  if (!res.items.length) return render('<h1>Review quests</h1>' + note('ok', 'All caught up 🎉'));

  render('<h1>Review quests</h1><p class="sub">' + res.items.length + ' waiting</p>' +
    res.items.map(it =>
      '<div class="card" id="s' + it.row + '">' +
        '<p class="sub" style="margin:0 0 8px"><b>' + esc(it.who) + '</b> · Round ' +
          esc(it.round) + ' · ' + esc(it.questId) + '</p>' +
        '<img class="sub-img" src="' + esc(it.img) + '" loading="lazy" alt="">' +
        '<div class="flex">' +
          '<button class="row" data-row="' + it.row + '" data-pass="1">Pass</button>' +
          '<button class="row warn" data-row="' + it.row + '" data-pass="">Reject</button>' +
        '</div></div>').join('')
  );

  app.querySelectorAll('button[data-row]').forEach(b => b.addEventListener('click', async () => {
    const card = $('#s' + b.dataset.row);
    card.querySelectorAll('button').forEach(x => x.disabled = true);
    await api('review', { row: b.dataset.row, pass: !!b.dataset.pass });
    card.remove();
  }));
}

// ---------- boot ------------------------------------------------------------

const SCREENS = { register: screenRegister, hint: screenHint, quest: screenQuest,
                  wallet: screenWallet, checkin: screenCheckin, staff: screenStaff };

(async function () {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) return liff.login();

    // Start the backend call and paint in parallel. The registration form needs
    // no data to draw, so a first-time user sees it immediately instead of
    // staring at "Loading…" for the whole Apps Script round trip.
    const pending = api('me');
    if (page === 'register') screenRegister();

    me = await pending;
    if (me.error) return render(note('err', me.message || 'Could not sign you in'));
    if (!me.registered && page !== 'register') {
      return render('<h1>Not registered yet</h1>' +
        '<div class="card"><p class="sub">Tap <b>Register</b> in the chat menu first.</p></div>');
    }
    // Re-draw register only if there is something to prefill.
    if (page === 'register' && !me.registered) return;
    (SCREENS[page] || screenWallet)();
  } catch (err) {
    render(note('err', 'Something went wrong: ' + err.message) +
      '<button onclick="location.reload()">Try again</button>');
  }
})();
</script>
</body>
</html>
